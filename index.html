<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE History — Games</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --accent: #e3b341;
    --text: #e8e8ea;
    --muted: #9a9ca8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    text-align: center;
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 40px;
    text-align: center;
  }
  .grid {
    display: grid;
    gap: 20px;
    width: 100%;
    max-width: 700px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  a.card {
    background: var(--card);
    border: 1px solid #2a2d3a;
    border-radius: 14px;
    padding: 28px 24px;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .emoji {
    font-size: 2.2rem;
    display: block;
    margin-bottom: 10px;
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 1.2rem;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <h1>IGCSE History — Games</h1>
  <p class="sub">Pick a game to play.</p>
  <div class="grid">
    <a class="card" href="GreatWall.html">
      <span class="emoji">🏯</span>
      <h2>Great Wall Run</h2>
      <p>Mao is chasing you along the Great Wall. Answer questions correctly to survive 20 rounds and escape.</p>
    </a>
    <a class="card" href="croissant-bomb.html">
      <span class="emoji">🥐</span>
      <h2>Deng Croissant Bomb</h2>
      <p>IGCSE China · Deng Xiaoping 1976–89. Defuse the questions before time runs out.</p>
    </a>
  </div>
</body>
</html>
